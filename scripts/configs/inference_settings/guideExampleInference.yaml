models:
  Llama-3.1-8B-Instruct: llama8b
adapters:
  llama8b/A4b-EAE-r16-Llama-3.1-8B-Instruct: A4bEAEr16
model_type: guide
batch_size: 2
model_init_kwargs:
  quantised: true
dataset: ACE05
splits:
  - 1
prompts:
  EAEPrompter1: EAE1
  EAEPrompter6: EAE6
num_examples:
  - 5
seed: 42
sentence_embeddings:
  intfloat/multilingual-e5-small: e5small
config_folder: guideExampleInference
output_format:
  json_schema: s

# These configs provide definitions of models and prompts - can probably stay the same between files
large_models:
  mistral-large:123b: mistral123b
  llama3.3:70b: llama70b
prompts_random_examples:
  - EDPrompter3
  - EAEPrompter3
  - EAEPrompter4
prompts_similar_examples:
  - EDPrompter4
  - EAEPrompter5
  - EAEPrompter6
prompts_arg_extraction:
  - EAEPrompter1
  - EAEPrompter2
  - EAEPrompter3
  - EAEPrompter4
  - EAEPrompter5
  - EAEPrompter6
