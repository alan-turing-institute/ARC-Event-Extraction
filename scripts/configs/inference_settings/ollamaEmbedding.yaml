models:
  llama3.1:8b: llama8b
  mistral-small:24b: mistral24b
model_type: ollama
batch_size: 8
model_init_kwargs:
dataset: ACE05
splits:
  - 1
prompts:
  EDPrompter4: ED4
  EAEPrompter5: EAE5
  EAEPrompter6: EAE6
num_examples:
  - 5
seed: 42
sentence_embeddings:
  intfloat/multilingual-e5-small: e5small
  all-mpnet-base-v2: mpnetbase
  all-MiniLM-L6-v2: mimilmL6
  average_word_embeddings_glove.6B.300d: glove
config_folder: ollamaEmbedding
output_format:
  json_schema: s

# These configs provide definitions of models and prompts - can probably stay the same between files
large_models:
  mistral-large:123b: mistral123b
  llama3.3:70b: llama70b
prompts_random_examples:
  - EDPrompter3
  - EAEPrompter3
  - EAEPrompter4
prompts_similar_examples:
  - EDPrompter4
  - EAEPrompter5
  - EAEPrompter6
prompts_arg_extraction:
  - EAEPrompter1
  - EAEPrompter2
  - EAEPrompter3
  - EAEPrompter4
  - EAEPrompter5
  - EAEPrompter6
